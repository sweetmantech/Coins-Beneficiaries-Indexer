# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: inprocess-indexers
contracts:
  - name: InProcessCreatorFixedPriceSaleStrategy
    handler: src/EventHandlers.ts
    events:
      - event: SaleSet (address indexed mediaContract, uint256 indexed tokenId, (uint64, uint64, uint64, uint96, address) salesConfig)
        field_selection:
          transaction_fields:
            - hash
      - event: MintComment(address indexed sender, address indexed tokenContract, uint256 indexed tokenId, uint256 quantity, string comment)
        field_selection:
          transaction_fields:
            - hash

  - name: InProcessERC20Minter
    handler: src/EventHandlers.ts
    events:
      - event: MintComment(address indexed sender, address indexed tokenContract, uint256 indexed tokenId, uint256 quantity, string comment)
        field_selection:
          transaction_fields:
            - hash
      - event: ERC20RewardsDeposit(address indexed createReferral, address indexed mintReferral, address indexed firstMinter, address zora, address collection, address currency, uint256 tokenId, uint256 createReferralReward, uint256 mintReferralReward, uint256 firstMinterReward, uint256 zoraReward)
        field_selection:
          transaction_fields:
            - hash
      - event: SaleSet (address indexed mediaContract, uint256 indexed tokenId, (uint64, uint64, uint64, uint256, address, address) salesConfig)
        field_selection:
          transaction_fields:
            - hash

  - name: InProcessCreatorFactory
    handler: src/EventHandlers.ts
    events:
      - event: SetupNewContract(address indexed newContract, address indexed creator, address indexed defaultAdmin, string contractURI, string name, (uint32, uint32, address) defaultRoyaltyConfiguration)
        field_selection:
          transaction_fields:
            - hash

  # Zora Comments protocol — filter to InProcess collections in handler
  - name: ZoraComments
    handler: src/EventHandlers.ts
    events:
      - event: Commented(bytes32 indexed commentId, (address,address,uint256,bytes32) commentIdentifier, bytes32 replyToId, (address,address,uint256,bytes32) replyTo, uint256 sparksQuantity, string text, uint256 timestamp, address referrer)
        field_selection:
          transaction_fields:
            - hash

  # In Process Comments proxy (free comments; same Commented ABI as Zora)
  - name: InProcessComments
    handler: src/EventHandlers.ts
    events:
      - event: Commented(bytes32 indexed commentId, (address,address,uint256,bytes32) commentIdentifier, bytes32 replyToId, (address,address,uint256,bytes32) replyTo, uint256 sparksQuantity, string text, uint256 timestamp, address referrer)
        field_selection:
          transaction_fields:
            - hash

  - name: InProcessMoment
    handler: src/EventHandlers.ts
    events:
      - event: UpdatedPermissions(uint256 indexed tokenId, address indexed user, uint256 indexed permissions)
        field_selection:
          transaction_fields:
            - hash
      - event: ContractMetadataUpdated(address indexed updater, string uri, string name)
        field_selection:
          transaction_fields:
            - hash
      - event: SetupNewToken (uint256 indexed tokenId, address indexed sender, string newURI, uint256 maxSupply)
        field_selection:
          transaction_fields:
            - hash
      - event: URI (string value, uint256 indexed id)
        field_selection:
          transaction_fields:
            - hash
      - event: Purchased (address indexed sender, address indexed minter, uint256 indexed tokenId, uint256 quantity, uint256 value)
        field_selection:
          transaction_fields:
            - hash
      - event: TransferSingle (address indexed operator, address indexed from, address indexed to, uint256 id, uint256 value)
        field_selection:
          transaction_fields:
            - hash
      - event: UpdatedRoyalties(uint256 indexed tokenId, address indexed user, (uint32, uint32, address) configuration)
        field_selection:
          transaction_fields:
            - hash

  - name: CatalogReleaseFactory
    handler: src/EventHandlers.ts
    events:
      - event: CRContractCreated (address indexed _contractAddress, address indexed _creator)
        field_selection:
          transaction_fields:
            - hash
            - input

  - name: USDCFixedPriceController
    handler: src/EventHandlers.ts
    events:
      - event: AlbumMintConfigurationUpdated (address indexed releaseContract, uint256 indexed albumId, (uint96, address, uint256[]) configuration)
        field_selection:
          transaction_fields:
            - hash

  - name: CatalogRelease1155
    handler: src/EventHandlers.ts
    events:
      - event: URI (string value, uint256 indexed id)
        field_selection:
          transaction_fields:
            - hash
      - event: TokenCreated (uint256 indexed _tokenId, address _contract, address indexed _artist, string _uri, bytes32 indexed _contentHash)
        field_selection:
          transaction_fields:
            - hash
      - event: TokenPurchased (uint256 indexed tokenId, uint256 indexed amount, address indexed buyer, address referrer0, address referrer1)
        field_selection:
          transaction_fields:
            - hash
      - event: AlbumPurchased (uint256 indexed albumId, address indexed buyer, address referrer0, address referrer1)
        field_selection:
          transaction_fields:
            - hash
      - event: TokenMinted (uint256 indexed tokenId, address indexed artist, uint256 amount)
        field_selection:
          transaction_fields:
            - hash

  - name: SoundCreatorV2
    handler: src/EventHandlers.ts
    events:
      - event: "Created(address indexed implementation, address indexed edition, address indexed owner, bytes initData, address[] contracts, bytes[] data, bytes[] results)"
        field_selection:
          transaction_fields:
            - hash

  - name: SoundEditionV2_1
    handler: src/EventHandlers.ts
    events:
      - event: "ContractURISet(string contractURI)"
        field_selection:
          transaction_fields:
            - hash
      - event: "BaseURISet(string baseURI)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TierCreated((uint8,uint32,uint32,uint32,bool,bool) creation)"
        field_selection:
          transaction_fields:
            - hash
      - event: "Minted(uint8 tier, address to, uint256 quantity, uint256 fromTokenId)"
        field_selection:
          transaction_fields:
            - hash
      - event: "Airdropped(uint8 tier, address[] to, uint256 quantity, uint256 fromTokenId)"
        field_selection:
          transaction_fields:
            - hash

  - name: SoundMetadata
    handler: src/EventHandlers.ts
    events:
      - event: "BaseURISet(address indexed edition, uint8 tier, string uri)"
        field_selection:
          transaction_fields:
            - hash

  - name: ZoraMedia
    handler: src/EventHandlers.ts
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)
        field_selection:
          transaction_fields:
            - hash
            - input
      - event: TokenURIUpdated(uint256 indexed _tokenId, address owner, string _uri)
        field_selection:
          transaction_fields:
            - hash
      - event: TokenMetadataURIUpdated(uint256 indexed _tokenId, address owner, string _uri)
        field_selection:
          transaction_fields:
            - hash

  - name: ZoraCreatorFactory
    handler: src/EventHandlers.ts
    events:
      - event: SetupNewContract(address indexed newContract, address indexed creator, address indexed defaultAdmin, string contractURI, string name, (uint32, uint32, address) defaultRoyaltyConfiguration)
        field_selection:
          transaction_fields:
            - hash

  - name: ZoraCreator1155
    handler: src/EventHandlers.ts
    events:
      - event: ContractMetadataUpdated(address indexed updater, string uri, string name)
        field_selection:
          transaction_fields:
            - hash
      - event: SetupNewToken (uint256 indexed tokenId, address indexed sender, string newURI, uint256 maxSupply)
        field_selection:
          transaction_fields:
            - hash
      - event: URI (string value, uint256 indexed id)
        field_selection:
          transaction_fields:
            - hash
  - name: InPublic1155
    handler: src/EventHandlers.ts
    events:
      - event: SetupNewToken (uint256 indexed tokenId, address indexed sender, string newURI, uint256 maxSupply)
        field_selection:
          transaction_fields:
            - hash
      - event: URI (string value, uint256 indexed id)
        field_selection:
          transaction_fields:
            - hash
      - event: TransferSingle (address indexed operator, address indexed from, address indexed to, uint256 id, uint256 value)
        field_selection:
          transaction_fields:
            - hash
      - event: TransferBatch (address indexed operator, address indexed from, address indexed to, uint256[] ids, uint256[] values)
        field_selection:
          transaction_fields:
            - hash
  - name: ZoraCreatorFixedPriceSaleStrategy
    handler: src/EventHandlers.ts
    events:
      - event: MintComment(address indexed sender, address indexed tokenContract, uint256 indexed tokenId, uint256 quantity, string comment)
        field_selection:
          transaction_fields:
            - hash
